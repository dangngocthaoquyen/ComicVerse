<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Chapter - ComicVerse</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Nunito', sans-serif; background: #f4f6f9; min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; }
        .form-container { background: white; width: 100%; max-width: 600px; padding: 40px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 20px; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #dfe4ea; border-radius: 8px; box-sizing: border-box; }
        
        .upload-area { border: 2px dashed #cbd5e0; padding: 30px; text-align: center; border-radius: 10px; cursor: pointer; transition: 0.3s; background: #f8fafc; }
        .upload-area:hover { border-color: #ff4757; background: #fff0f1; }
        
        .btn-submit { width: 100%; padding: 14px; background: #ff4757; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="form-container">
    <h2 style="text-align: center; color: #2f3542;">Đăng Chapter Mới</h2>
    <p style="text-align: center; color: #ff4757; font-weight: bold;" th:text="${comic.title}"></p>

    <form th:action="@{'/comic/' + ${comic.id} + '/upload-chapter'}" method="post" enctype="multipart/form-data">
        
        <div class="form-group">
            <label>Số chương (*)</label>
            <input type="number" step="0.1" name="chapterNumber" class="form-control" placeholder="Nhập số: 1, 2, 1.5..." required>
        </div>

        <div class="form-group">
            <label>Tên chương (Không bắt buộc)</label>
            <input type="text" name="chapterName" class="form-control" placeholder="VD: Sự khởi đầu (Nếu có)">
        </div>

        <div class="form-group">
            <label>Nội dung truyện (Ảnh cắt)</label>
            <div class="upload-area" onclick="document.getElementById('imgInput').click()">
                <i class="fas fa-images" style="font-size: 3rem; color: #a4b0be; margin-bottom: 10px;"></i>
                <p>Nhấn vào đây -> Vào Folder ảnh -> Bấm <b>Ctrl + A</b> để chọn hết</p>
                <input type="file" id="imgInput" name="images" accept="image/*" multiple style="display: none;" onchange="updateCount(this)" required>
            </div>
            <p id="file-count" style="text-align: center; color: green; display: none;"></p>
        </div>

        <button type="submit" class="btn-submit">Đăng Ngay</button>
    </form>
    
    <a th:href="@{/comic/manage}" style="display: block; text-align: center; margin-top: 15px; color: #747d8c; text-decoration: none;">Quay lại</a>
</div>

<script>
    function updateCount(input) {
        if (input.files.length > 0) {
            document.getElementById('file-count').style.display = 'block';
            document.getElementById('file-count').innerText = '✅ Đã chọn ' + input.files.length + ' ảnh.';
        }
    }
</script>

</body>
</html>
