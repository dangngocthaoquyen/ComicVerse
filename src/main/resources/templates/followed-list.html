<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tủ truyện theo dõi - ComicVerse</title>
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link
	href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
	rel="stylesheet">

<style>
:root {
	--primary: #ff4757;
	--dark: #2f3542;
	--light-bg: #f4f6f9;
	--white: #ffffff;
	--text-gray: #747d8c;
}

body {
	font-family: 'Nunito', sans-serif;
	background-color: var(--light-bg);
	margin: 0;
	padding: 0;
	color: var(--dark);
}

/* CONTAINER */
.container {
	max-width: 1200px;
	margin: 30px auto;
	padding: 0 20px;
}

/* HEADER SECTION */
.page-header {
	background: var(--white);
	padding: 25px 30px;
	border-radius: 15px;
	box-shadow: 0 5px 20px rgba(0, 0, 0, 0.03);
	display: flex;
	justify-content: space-between;
	align-items: center;
	margin-bottom: 30px;
}

.header-title {
	display: flex;
	align-items: center;
	gap: 15px;
}

.header-icon {
	width: 50px;
	height: 50px;
	background: #fff0f1;
	color: var(--primary);
	border-radius: 12px;
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: 1.5rem;
}

.header-info h2 {
	margin: 0;
	font-size: 1.5rem;
	color: var(--dark);
}

.header-info p {
	margin: 5px 0 0;
	color: var(--text-gray);
	font-size: 0.95rem;
}

.btn-home {
	text-decoration: none;
	color: var(--dark);
	font-weight: 700;
	display: flex;
	align-items: center;
	gap: 8px;
	transition: 0.3s;
	padding: 8px 15px;
	border-radius: 8px;
}

.btn-home:hover {
	background: #f1f2f6;
	color: var(--primary);
}

/* GRID LAYOUT */
.comic-grid {
	display: grid;
	/* Responsive: Tự động chia cột, min 200px */
	grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
	gap: 25px;
}

/* COMIC CARD STYLE */
.comic-card {
	background: var(--white);
	border-radius: 12px;
	overflow: hidden;
	box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
	transition: all 0.3s ease;
	position: relative;
	display: flex;
	flex-direction: column;
}

.comic-card:hover {
	transform: translateY(-5px);
	box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
}

/* Cover Image (2:3 Ratio) */
.cover-wrapper {
	position: relative;
	width: 100%;
	aspect-ratio: 2/3;
	overflow: hidden;
}

.comic-cover {
	width: 100%;
	height: 100%;
	object-fit: cover;
	transition: transform 0.5s ease;
}

.comic-card:hover .comic-cover {
	transform: scale(1.05);
}

/* Status Badge */
.status-badge {
	position: absolute;
	top: 10px;
	left: 10px;
	padding: 4px 8px;
	border-radius: 6px;
	font-size: 0.65rem;
	font-weight: 800;
	text-transform: uppercase;
	color: white;
	z-index: 2;
	box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
}

.st-ongoing {
	background: #2ed573;
}

.st-completed {
	background: #3742fa;
}

.st-dropped {
	background: #ff4757;
}

/* Card Content */
.card-body {
	padding: 12px;
	flex-grow: 1;
	display: flex;
	flex-direction: column;
}

.comic-title {
	margin: 0 0 5px;
	font-size: 1rem;
	font-weight: 700;
	color: var(--dark);
	display: -webkit-box;
	-webkit-line-clamp: 2;
	-webkit-box-orient: vertical;
	overflow: hidden;
	text-decoration: none;
	line-height: 1.3;
}

.comic-title:hover {
	color: var(--primary);
}

.latest-chap {
	font-size: 0.8rem;
	color: var(--text-gray);
	margin-bottom: 10px;
	display: flex;
	align-items: center;
	gap: 5px;
}

.chap-pill {
	background: #fff3cd;
	color: #856404;
	padding: 2px 6px;
	border-radius: 4px;
	font-weight: bold;
	font-size: 0.75rem;
}

/* Action Footer */
.card-footer {
	margin-top: auto;
	padding-top: 10px;
	border-top: 1px solid #f1f2f6;
	display: flex;
	justify-content: space-between;
	align-items: center;
}

.view-count {
	font-size: 0.8rem;
	color: #a4b0be;
}

.btn-unfollow {
	background: none;
	border: none;
	cursor: pointer;
	color: #ff4757;
	font-size: 0.9rem;
	padding: 5px;
	transition: 0.2s;
	border-radius: 5px;
}

.btn-unfollow:hover {
	background: #fff0f1;
}

/* EMPTY STATE */
.empty-state {
	text-align: center;
	padding: 60px 20px;
	background: var(--white);
	border-radius: 15px;
}

.empty-img {
	width: 200px;
	opacity: 0.6;
	margin-bottom: 20px;
}

.btn-explore {
	display: inline-block;
	margin-top: 20px;
	padding: 10px 25px;
	background: var(--primary);
	color: white;
	text-decoration: none;
	border-radius: 25px;
	font-weight: bold;
	box-shadow: 0 5px 15px rgba(255, 71, 87, 0.3);
	transition: 0.3s;
}

.btn-explore:hover {
	transform: translateY(-2px);
	background: #e04050;
}
</style>
</head>
<body>

	<div class="container">

		<div class="page-header">
			<div class="header-title">
				<div class="header-icon">
					<i class="fas fa-heart"></i>
				</div>
				<div class="header-info">
					<h2>Tủ truyện yêu thích</h2>
					<p>
						Bạn đang theo dõi <strong th:text="${followedComics.size()}"
							style="color: var(--primary);">0</strong> bộ truyện
					</p>
				</div>
			</div>
			<a th:href="@{/home}" class="btn-home"><i
				class="fas fa-arrow-left"></i> Trang chủ</a>
		</div>

		<div th:if="${followedComics == null or followedComics.isEmpty()}"
			class="empty-state">
			<img
				src="https://cdni.iconscout.com/illustration/premium/thumb/empty-box-356-1160893.png"
				class="empty-img" alt="Empty">
			<h3>Tủ truyện trống trơn!</h3>
			<p style="color: var(--text-gray);">Hãy khám phá và thả tim cho
				những bộ truyện bạn yêu thích nhé.</p>
			<a th:href="@{/home}" class="btn-explore">Khám phá ngay</a>
		</div>

		<div class="comic-grid">
			<div th:each="c : ${followedComics}" class="comic-card">

				<a th:href="@{'/truyen/' + ${c.slug}}" class="cover-wrapper"> <span
					class="status-badge"
					th:classappend="${c.status.name() == 'COMPLETED' ? 'st-completed' : (c.status.name() == 'DROPPED' ? 'st-dropped' : 'st-ongoing')}"
					th:text="${c.status}"> </span> <img
					th:src="${c.coverImage != null ? c.coverImage : '/images/no-cover.jpg'}"
					class="comic-cover" alt="Cover">
				</a>

				<div class="card-body">
					<a th:href="@{'/truyen/' + ${c.slug}}" class="comic-title"
						th:text="${c.title}" th:title="${c.title}"> Tên truyện </a>

					<div class="latest-chap">
						<i class="fas fa-clock"></i> Mới nhất: <a
							th:if="${c.latestChapterNum != null}"
							th:href="@{'/truyen/' + ${c.slug} + '/chap-' + ${c.latestChapterNum}}"
							class="chap-pill" style="text-decoration: none; cursor: pointer;"
							th:text="'Chap ' + ${c.latestChapterNum}"> Chap ? </a> <span
							th:if="${c.latestChapterNum == null}" class="chap-pill"
							style="background: #eee; color: #aaa;"> N/A </span>
					</div>
					<div class="card-footer">
						<span class="view-count"><i class="fas fa-eye"></i> <span
							th:text="${c.viewCount}">0</span></span>

						<form th:action="@{'/follow/' + ${c.id}}" method="post"
							style="margin: 0;">
							<button type="submit" class="btn-unfollow" title="Bỏ theo dõi"
								onclick="return confirm('Bạn chắc chắn muốn bỏ theo dõi truyện này?');">
								<i class="fas fa-heart-broken"></i> Bỏ theo dõi
							</button>
						</form>
					</div>
				</div>

			</div>
		</div>

	</div>

</body>
</html>
